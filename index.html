<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#53C2EC">
<title>8660 ROUTES · De Panne</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Lexend:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF8FB;--surface:#fff;--surface-2:#DDEFF5;--ink:#18182E;--muted:#5B5B72;--line:#D3E5EB;--sea:#0F7FAA;--blue:#53C2EC;--dune:#E9C46A;--ok:#2E8A5C;--display:"Barlow Condensed",sans-serif;--body:"Lexend",sans-serif;--mono:"JetBrains Mono",monospace;--radius:14px;--shadow:0 1px 2px rgba(15,42,51,.06),0 8px 24px rgba(15,42,51,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#100F24;--surface:#1A1937;--surface-2:#232247;--ink:#EEF8FB;--muted:#A9AFC8;--line:#2E2D57}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.nav{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-bottom:3px solid var(--blue)}
.nav .wrap{display:flex;align-items:center;height:60px}
.brand{font-family:var(--display);font-weight:900;font-size:1.45rem;text-decoration:none;color:var(--ink)}
.kicker{font-family:var(--mono);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--sea);font-weight:600}
h1,h2,h3{font-family:var(--display);line-height:.95;margin:0;text-transform:uppercase;font-weight:800}
h1{font-size:clamp(2.6rem,7vw,4.2rem)}
.lede{color:var(--muted);max-width:62ch}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:700 .85rem var(--body);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border-top:4px solid var(--blue)}
.card h3{font-size:1.45rem;margin-bottom:6px}
.meta{font-family:var(--mono);font-size:.8rem;color:var(--sea);margin-bottom:8px}
.badge{display:inline-block;font:600 .65rem var(--mono);letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 8px;background:var(--dune);color:#16152C;margin-right:4px}
footer{margin-top:48px;padding:24px 0;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<nav class="nav"><div class="wrap"><a class="brand" href="/">8660 ROUTES</a></div></nav>
<div class="wrap">
<p class="kicker">8660 De Panne · Adinkerke</p>
<h1>Wandel- & looproutes</h1>
<p class="lede">Officiële routes door duinen, bos, strand en historisch De Panne. Filter op thema of lengte. Perfect te combineren met 8660 LOOPT.</p>

<div class="filters">
<button class="chip on" data-f="all">Alle</button>
<button class="chip" data-f="duinen">Duinen</button>
<button class="chip" data-f="bos">Bos</button>
<button class="chip" data-f="oorlog">Oorlog</button>
<button class="chip" data-f="kids">Kids</button>
<button class="chip" data-f="toegankelijk">Toegankelijk</button>
<button class="chip" data-f="kort">Kort (&lt;5 km)</button>
</div>

<div class="grid" id="routes"></div>

<footer>
<p>8660 ROUTES · Gemaakt in 8660. Bron: gemeente De Panne. <a href="https://8660-dashboard.vercel.app">Terug naar dashboard</a> · <a href="https://sixk-club-smsak.vercel.app">Open in 8660 LOOPT</a></p>
</footer>
</div>
<script>
const routes = [
  {name:"Westhoek walking route", km:10.5, theme:["duinen"], level:"Matig", desc:"Flanders’ oldest and largest dune reserve. Pure nature."},
  {name:"Beaufort walking route", km:7.9, theme:["kunst"], level:"Makkelijk", desc:"Discover several Beaufort artworks in De Panne."},
  {name:"Zwarten Hoek walking route", km:9.7, theme:["natuur"], level:"Matig", desc:"Watery natural area with ponds from old sand quarries."},
  {name:"Walking on wheels", km:4.0, theme:["toegankelijk","bos"], level:"Makkelijk", desc:"Explore the woods, even with reduced mobility."},
  {name:"Oosthoek walking route", km:4.5, theme:["bos","duinen"], level:"Matig", desc:"Transition between woodland, dunes and polder."},
  {name:"Sleedoorn walking route", km:2.7, theme:["bos","kort"], level:"Makkelijk", desc:"Wooded area with dry moss dunes and dune grasslands."},
  {name:"War walk: De Panne in WO I", km:23.0, theme:["oorlog"], level:"Zwaar", desc:"Important role behind the Yser Front during the First World War."},
  {name:"Adinkerke’s prettiest spots", km:9.2, theme:["platteland"], level:"Matig", desc:"Discover the countryside of Adinkerke."},
  {name:"Calmeyn walk", km:4.9, theme:["bos"], level:"Makkelijk", desc:"Deciduous woodland."},
  {name:"Cabourtje tour", km:6.4, theme:["duinen"], level:"Matig", desc:"Fossil dunes over 5,000 years old."},
  {name:"The proud fishing past", km:4.5, theme:["erfgoed"], level:"Makkelijk", desc:"Heritage route about fishing history."},
  {name:"Westerpunt walk", km:2.9, theme:["strand","kort"], level:"Makkelijk", desc:"Beach or seafront promenade."},
  {name:"Blue nature loop", km:6.7, theme:["duinen","bos"], level:"Matig", desc:"Running route through dunes and woods."},
  {name:"Pink nature loop", km:2.0, theme:["duinen","kort"], level:"Makkelijk", desc:"Beginner running route."},
  {name:"Green nature loop", km:4.6, theme:["duinen","bos"], level:"Makkelijk", desc:"Beginner nature loop."},
  {name:"Walking escapegame 1: Zeno de Zeehond", km:1.5, theme:["kids","kort"], level:"Makkelijk", desc:"Fun kids escape game."},
  {name:"Activity trail for kids", km:1.2, theme:["kids","kort"], level:"Makkelijk", desc:"Kidsproof activity trail."},
  {name:"Heritage walking route", km:4.3, theme:["erfgoed"], level:"Makkelijk", desc:"Architectural heritage, historic and modernist."}
];

function render(filter="all"){
  const el=document.getElementById("routes");
  el.innerHTML="";
  routes.filter(r=>filter==="all"||r.theme.includes(filter)).forEach(r=>{
    const card=document.createElement("div");
    card.className="card";
    card.innerHTML=`<div class="meta">${r.km} km · ${r.level}</div>
      <h3>${r.name}</h3>
      <p>${r.desc}</p>
      <div style="margin-top:10px">${r.theme.map(t=>`<span class="badge">${t}</span>`).join("")}</div>`;
    el.appendChild(card);
  });
}
render();

document.querySelectorAll(".chip").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".chip").forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");
    render(btn.dataset.f);
  };
});
</script>
</body>
</html>
